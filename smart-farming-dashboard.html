<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌾 แดชบอร์ดการเงินเกษตรอัจฉริยะ</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:  #22c55e;
      --green-light: #dcfce7;
      --red:    #ef4444;
      --red-light: #fee2e2;
      --blue:   #3b82f6;
      --blue-light: #dbeafe;
      --gray:   #6b7280;
      --bg:     #f1f5f9;
      --card:   #ffffff;
      --border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
      --radius: 16px;
    }

    body {
      font-family: 'Segoe UI', 'Noto Sans Thai', sans-serif;
      background: var(--bg);
      color: #1e293b;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #14532d 0%, #16a34a 60%, #4ade80 100%);
      color: #fff;
      padding: 32px 24px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 800; letter-spacing: .5px; }
    header p  { font-size: .95rem; opacity: .85; margin-top: 4px; }
    .badge {
      display: inline-block;
      margin-top: 12px;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 999px;
      letter-spacing: 1px;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    /* ── LAYOUT ── */
    main { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .controls label { font-weight: 600; font-size: .9rem; color: var(--gray); }
    .controls select, .controls button {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      font-size: .9rem;
      cursor: pointer;
      background: var(--card);
      color: #1e293b;
      transition: all .2s;
    }
    .controls select:focus, .controls button:focus { outline: 2px solid var(--green); outline-offset: 2px; }
    .controls button {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
      font-weight: 700;
    }
    .controls button:hover { background: #16a34a; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,197,94,.35); }

    /* ── SUMMARY CARDS ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 24px 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: transform .25s, box-shadow .25s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }

    .summary-card .icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 14px;
    }
    .summary-card .label { font-size: .8rem; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: .8px; }
    .summary-card .value { font-size: 1.85rem; font-weight: 800; margin: 4px 0 2px; line-height: 1.1; }
    .summary-card .sub   { font-size: .78rem; color: var(--gray); }

    .income-card  .icon  { background: var(--green-light); }
    .income-card  .value { color: var(--green); }
    .expense-card .icon  { background: var(--red-light); }
    .expense-card .value { color: var(--red); }
    .balance-card .icon  { background: var(--blue-light); }
    .balance-card .value { color: var(--blue); }

    /* ── CHARTS GRID ── */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .chart-card { padding: 22px; position: relative; }
    .chart-card h3 { font-size: .95rem; font-weight: 700; margin-bottom: 18px; color: #334155; }
    .chart-wrap { position: relative; width: 100%; }

    /* ── INSIGHTS ── */
    .insights-section { margin-bottom: 28px; }
    .insights-section h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; color: #1e293b; }
    .insights-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }
    .insight-card {
      padding: 18px 20px;
      border-radius: 14px;
      border-left: 5px solid transparent;
    }
    .insight-card .i-title { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
    .insight-card .i-body  { font-size: .9rem; font-weight: 600; line-height: 1.5; }
    .insight-card.info   { background: #eff6ff; border-color: #3b82f6; }
    .insight-card.warn   { background: #fff7ed; border-color: #f97316; }
    .insight-card.good   { background: #f0fdf4; border-color: #22c55e; }
    .insight-card.bad    { background: #fef2f2; border-color: #ef4444; }
    .insight-card.tip    { background: #fdf4ff; border-color: #a855f7; }

    /* ── TABLE ── */
    .table-section { margin-bottom: 28px; }
    .table-section h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; color: #1e293b; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .875rem;
    }
    thead th {
      background: #f8fafc;
      padding: 12px 16px;
      text-align: left;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--gray);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 16px; vertical-align: middle; }
    .badge-income  { background: var(--green-light); color: #15803d; font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    .badge-expense { background: var(--red-light);   color: #b91c1c; font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
    .amount-income  { color: var(--green); font-weight: 700; }
    .amount-expense { color: var(--red);   font-weight: 700; }

    /* ── STATUS BADGE ── */
    .status-badge-wrap {
      text-align: center;
      margin-bottom: 20px;
    }
    .status-badge-main {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 36px;
      border-radius: 999px;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 6px 24px rgba(0,0,0,.13);
      letter-spacing: .3px;
      transition: transform .2s;
    }
    .status-badge-main:hover { transform: scale(1.03); }
    .status-badge-main.good    { background: #dcfce7; color: #15803d; border: 2.5px solid #22c55e; }
    .status-badge-main.neutral { background: #fef9c3; color: #78350f; border: 2.5px solid #eab308; }
    .status-badge-main.bad     { background: #fee2e2; color: #b91c1c; border: 2.5px solid #ef4444; }
    .status-badge-main .badge-sub { font-size: .85rem; font-weight: 600; opacity: .75; }

    /* ── QUICK INSIGHT TEXT ── */
    .quick-insight {
      background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 28px;
      border-left: 4px solid var(--green);
      line-height: 1.6;
    }
    .quick-insight span { color: var(--green); }
    .quick-insight span.warn { color: #ef4444; }

    /* ── INSIGHT GROUPS ── */
    .insight-group { margin-bottom: 24px; }
    .insight-group:last-child { margin-bottom: 0; }
    .insight-group-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #334155;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .insight-group .insights-grid { margin-bottom: 0; }

    /* ── LATEST TAG ── */
    .latest-tag {
      font-size: .7rem;
      background: #dcfce7;
      color: #15803d;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* ── TABLE LATEST ROW ── */
    tbody tr.latest-row { background: #f0fdf4 !important; }
    tbody tr.latest-row td { font-weight: 600; }

    /* ── FADE-IN ANIMATION ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp .45s ease both; }
    .fade-in-delay-1 { animation: fadeInUp .45s .08s ease both; }
    .fade-in-delay-2 { animation: fadeInUp .45s .16s ease both; }
    .fade-in-delay-3 { animation: fadeInUp .45s .24s ease both; }

    /* ── SUMMARY VALUE BIGGER ── */
    .summary-card .value { font-size: 2.1rem; }
    .summary-card .label { font-size: .85rem; text-transform: none; letter-spacing: 0; color: #475569; }

    @media (max-width: 600px) {
      header { padding: 22px 16px 18px; }
      main { padding: 18px 12px 40px; }
      .summary-card .value { font-size: 1.65rem; }
      .summary-grid { grid-template-columns: 1fr; }
      .status-badge-main { font-size: 1.2rem; padding: 14px 24px; }
      .charts-grid { grid-template-columns: 1fr !important; }
      .charts-grid .card[style*="span 2"] { grid-column: span 1 !important; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <h1>🌾 แดชบอร์ดการเงินเกษตรอัจฉริยะ</h1>
  <p>Smart Farming Financial Dashboard</p>
  <span class="badge">Demo Mode</span>
</header>

<main>

  <!-- ── CONTROLS ── -->
  <div class="controls">
    <label for="daySelect">📅 ช่วงเวลา:</label>
    <select id="daySelect">
      <option value="7">7 วันล่าสุด</option>
      <option value="14" selected>14 วันล่าสุด</option>
      <option value="30">30 วันล่าสุด</option>
    </select>
    <button id="reloadBtn">🔄 โหลดข้อมูลใหม่</button>
  </div>

  <!-- ── STATUS BADGE ── -->
  <div class="status-badge-wrap fade-in" id="statusBadgeWrap"></div>

  <!-- ── SUMMARY CARDS ── -->
  <div class="summary-grid" id="summaryGrid"></div>

  <!-- ── QUICK INSIGHT TEXT ── -->
  <div class="quick-insight fade-in-delay-1" id="quickInsight"></div>

  <!-- ── CHARTS ── -->
  <div class="charts-grid fade-in-delay-1">
    <div class="card chart-card" style="grid-column: span 2; min-width: 0;">
      <h3>📈 รายรับ vs รายจ่ายรายวัน</h3>
      <div class="chart-wrap"><canvas id="dailyChart"></canvas></div>
    </div>
    <div class="card chart-card">
      <h3>📅 รายรับ / รายจ่าย / กำไรรายเดือน</h3>
      <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
    </div>
    <div class="card chart-card">
      <h3>🗂️ เงินไปอยู่ที่ไหน</h3>
      <div class="chart-wrap" style="max-width:300px;margin:0 auto;"><canvas id="categoryChart"></canvas></div>
    </div>
  </div>

  <!-- ── INSIGHTS ── -->
  <section class="insights-section card fade-in-delay-2" style="padding:24px;">
    <h2>🧠 ผู้ช่วยวิเคราะห์ฟาร์ม</h2>
    <div id="insightsGrid"></div>
  </section>

  <!-- ── TABLE ── -->
  <section class="table-section card fade-in-delay-3" style="padding:24px;">
    <h2>📋 รายการล่าสุด</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>วันที่</th>
            <th>ประเภท</th>
            <th>หมวดหมู่</th>
            <th>หมายเหตุ</th>
            <th style="text-align:right">จำนวนเงิน (บาท)</th>
          </tr>
        </thead>
        <tbody id="txBody"></tbody>
      </table>
    </div>
  </section>

</main>

<script>
// ═══════════════════════════════════════════════
//  DATA LAYER
// ═══════════════════════════════════════════════

function getMockMonthlyData() {
  return [
    { month: 'ม.ค.', income: 52000, expense: 38000 },
    { month: 'ก.พ.', income: 61000, expense: 42000 },
    { month: 'มี.ค.', income: 47000, expense: 55000 }, // loss month
    { month: 'เม.ย.', income: 73000, expense: 39000 },
    { month: 'พ.ค.', income: 68000, expense: 44000 },
    { month: 'มิ.ย.', income: 80000, expense: 51000 },
  ];
}

function getMockCategoryData() {
  return [
    { label: 'ปุ๋ย',        value: 38000, color: '#22c55e' },
    { label: 'ค่าแรง',      value: 27000, color: '#3b82f6' },
    { label: 'น้ำมัน',      value: 18000, color: '#f97316' },
    { label: 'เมล็ดพันธุ์', value: 15000, color: '#a855f7' },
    { label: 'อื่นๆ',       value: 12000, color: '#ec4899' },
  ];
}

function getMockTransactions() {
  return [
    { date: '2024-06-28', type: 'income',  category: 'ขายข้าว',      note: 'ขายข้าวหอมมะลิ 2 ตัน',        amount: 32000 },
    { date: '2024-06-25', type: 'expense', category: 'ปุ๋ย',         note: 'ปุ๋ยยูเรีย 50 กระสอบ',          amount: 12500 },
    { date: '2024-06-22', type: 'income',  category: 'ขายผัก',       note: 'ผักคะน้า-กวางตุ้ง',            amount: 8400  },
    { date: '2024-06-20', type: 'expense', category: 'ค่าแรง',       note: 'จ้างเกี่ยวข้าว 6 คน',          amount: 9000  },
    { date: '2024-06-18', type: 'expense', category: 'น้ำมัน',       note: 'น้ำมันดีเซลรถไถ',              amount: 4200  },
    { date: '2024-06-15', type: 'income',  category: 'ขายข้าว',      note: 'ข้าวเปลือกขายโรงสี',           amount: 18600 },
    { date: '2024-06-12', type: 'expense', category: 'เมล็ดพันธุ์',  note: 'เมล็ดพันธุ์ข้าว กข6',          amount: 5500  },
    { date: '2024-06-10', type: 'expense', category: 'อื่นๆ',        note: 'ซ่อมปั๊มน้ำ',                  amount: 3200  },
    { date: '2024-06-08', type: 'income',  category: 'อุดหนุนรัฐ',   note: 'เงินอุดหนุนโครงการนาแปลงใหญ่', amount: 12000 },
    { date: '2024-06-05', type: 'expense', category: 'ปุ๋ย',         note: 'ปุ๋ยอินทรีย์ชีวภาพ',            amount: 6800  },
  ];
}

function getMockDailyData(days) {
  const labels = [];
  const income  = [];
  const expense = [];
  const now = new Date(2024, 5, 28); // 28 Jun 2024 (fixed seed base)

  // Seeded pseudo-random so each reload gives different numbers
  const seed = Date.now();
  function rnd(min, max, offset) {
    return Math.round(min + ((Math.sin(seed + offset) + 1) / 2) * (max - min));
  }

  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    labels.push(`${d.getDate()}/${d.getMonth() + 1}`);
    income.push(rnd(800, 8000, i * 13));
    expense.push(rnd(400, 5500, i * 17 + 1));
  }
  return { labels, income, expense };
}

// ═══════════════════════════════════════════════
//  RENDER SUMMARY
// ═══════════════════════════════════════════════

function renderSummary(monthly) {
  const totalIncome  = monthly.reduce((s, m) => s + m.income,  0);
  const totalExpense = monthly.reduce((s, m) => s + m.expense, 0);
  const balance      = totalIncome - totalExpense;

  const fmt = n => '฿' + n.toLocaleString('th-TH');

  const cards = [
    {
      cls: 'income-card',
      icon: '💰',
      label: 'รายรับทั้งหมด',
      value: fmt(totalIncome),
      sub: 'ม.ค. – มิ.ย. 2567',
    },
    {
      cls: 'expense-card',
      icon: '💸',
      label: 'รายจ่ายทั้งหมด',
      value: fmt(totalExpense),
      sub: 'ม.ค. – มิ.ย. 2567',
    },
    {
      cls: 'balance-card',
      icon: '🌾',
      label: 'เงินคงเหลือ',
      value: fmt(balance),
      sub: balance >= 0 ? '✅ มีกำไรสุทธิ' : '⚠️ ขาดทุน',
    },
  ];

  document.getElementById('summaryGrid').innerHTML = cards.map((c, i) => `
    <div class="card summary-card ${c.cls} fade-in" style="animation-delay:${i * 0.08}s">
      <div class="icon">${c.icon}</div>
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      <div class="sub">${c.sub}</div>
    </div>
  `).join('');
}

// ═══════════════════════════════════════════════
//  RENDER STATUS BADGE
// ═══════════════════════════════════════════════

function renderStatusBadge(monthly) {
  const n = monthly.length;
  const last = monthly[n - 1];
  const prev = monthly[n - 2];
  const lastProfit = last.income - last.expense;
  const prevProfit = prev.income - prev.expense;
  const changePct = prevProfit !== 0 ? ((lastProfit - prevProfit) / prevProfit * 100) : 0;

  let emoji, text, subText, cls;
  if (lastProfit < 0) {
    emoji = '🔴'; text = 'เสี่ยงขาดทุน'; cls = 'bad';
    subText = `เดือน ${last.month} ขาดทุน ฿${Math.abs(lastProfit).toLocaleString('th-TH')}`;
  } else if (changePct >= 5) {
    emoji = '🟢'; text = 'กำไรดี'; cls = 'good';
    subText = `กำไรเพิ่มขึ้น +${changePct.toFixed(0)}% จากเดือนก่อน`;
  } else if (changePct <= -5) {
    emoji = '🟡'; text = 'ทรงตัว'; cls = 'neutral';
    subText = `กำไรลดลง ${Math.abs(changePct).toFixed(0)}% จากเดือนก่อน ควรระวัง`;
  } else {
    emoji = '🟡'; text = 'ทรงตัว'; cls = 'neutral';
    subText = `กำไรใกล้เคียงเดิม ฿${lastProfit.toLocaleString('th-TH')} เดือนนี้`;
  }

  document.getElementById('statusBadgeWrap').innerHTML = `
    <div class="status-badge-main ${cls}">
      <span>${emoji}</span>
      <span>${text}</span>
      <span class="badge-sub">${subText}</span>
    </div>
  `;
}

// ═══════════════════════════════════════════════
//  RENDER QUICK INSIGHT TEXT
// ═══════════════════════════════════════════════

function renderQuickInsight(monthly) {
  const n = monthly.length;
  const last = monthly[n - 1];
  const prev = monthly[n - 2];
  const lastProfit = last.income - last.expense;
  const prevProfit = prev.income - prev.expense;
  const changePct = prevProfit !== 0 ? ((lastProfit - prevProfit) / prevProfit * 100).toFixed(1) : '0.0';

  const catData = getMockCategoryData();
  const totalCat = catData.reduce((s, c) => s + c.value, 0);
  const topCat = catData.reduce((a, b) => b.value > a.value ? b : a);
  const topPct = (topCat.value / totalCat * 100).toFixed(0);

  const trendText = parseFloat(changePct) >= 0
    ? `<span>กำไรเพิ่มขึ้น +${changePct}%</span> จากเดือนก่อน`
    : `<span class="warn">กำไรลดลง ${Math.abs(changePct)}%</span> จากเดือนก่อน`;

  document.getElementById('quickInsight').innerHTML =
    `💬 เดือนนี้ ${trendText} และค่าใช้จ่าย<strong>${topCat.label}</strong>สูงที่สุด คิดเป็น ${topPct}% ของรายจ่ายทั้งหมด`;
}

// ═══════════════════════════════════════════════
//  CHART INSTANCES (destroy before re-create)
// ═══════════════════════════════════════════════

const _charts = {};
function destroyChart(id) {
  if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
}

// ═══════════════════════════════════════════════
//  RENDER CHARTS
// ═══════════════════════════════════════════════

function renderCharts(days) {
  const monthly  = getMockMonthlyData();
  const catData  = getMockCategoryData();
  const daily    = getMockDailyData(days);

  // ── Daily Chart ──
  destroyChart('daily');
  _charts['daily'] = new Chart(document.getElementById('dailyChart'), {
    type: 'bar',
    data: {
      labels: daily.labels,
      datasets: [
        {
          label: 'รายรับ (บาท)',
          data: daily.income,
          backgroundColor: 'rgba(34,197,94,.7)',
          borderColor: '#16a34a',
          borderWidth: 1,
          borderRadius: 4,
        },
        {
          label: 'รายจ่าย (บาท)',
          data: daily.expense,
          backgroundColor: 'rgba(239,68,68,.65)',
          borderColor: '#dc2626',
          borderWidth: 1,
          borderRadius: 4,
        },
      ],
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' }, tooltip: { mode: 'index' } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '฿' + v.toLocaleString() } },
        x: { ticks: { maxRotation: 45, font: { size: 10 } } },
      },
    },
  });

  // ── Monthly Chart ──
  destroyChart('monthly');
  const profits = monthly.map(m => m.income - m.expense);
  const bestIdx  = profits.indexOf(Math.max(...profits));
  const worstIdx = profits.indexOf(Math.min(...profits));

  const incomeColors  = monthly.map((_, i) => i === bestIdx  ? 'rgba(21,128,61,.95)' : 'rgba(34,197,94,.65)');
  const expenseColors = monthly.map((_, i) => i === worstIdx ? 'rgba(185,28,28,.95)'  : 'rgba(239,68,68,.55)');

  _charts['monthly'] = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels: monthly.map(m => m.month),
      datasets: [
        {
          label: 'รายรับ',
          data: monthly.map(m => m.income),
          backgroundColor: incomeColors,
          borderRadius: 5,
        },
        {
          label: 'รายจ่าย',
          data: monthly.map(m => m.expense),
          backgroundColor: expenseColors,
          borderRadius: 5,
        },
        {
          type: 'line',
          label: 'กำไรสุทธิ',
          data: profits,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,.12)',
          pointBackgroundColor: profits.map(p => p >= 0 ? '#3b82f6' : '#ef4444'),
          pointRadius: 6,
          pointHoverRadius: 8,
          tension: 0.35,
          fill: true,
          yAxisID: 'y',
        },
      ],
    },
    options: {
      responsive: true,
      animation: { duration: 800, easing: 'easeInOutQuart' },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          mode: 'index',
          callbacks: {
            afterBody: (items) => {
              const idx = items[0]?.dataIndex;
              if (idx === bestIdx)  return ['🏆 เดือนกำไรสูงสุด'];
              if (idx === worstIdx) return ['⚠️ เดือนกำไรต่ำสุด'];
              return [];
            }
          }
        }
      },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '฿' + (v/1000).toFixed(0) + 'K' } },
      },
    },
  });

  // ── Category Doughnut ──
  destroyChart('category');
  _charts['category'] = new Chart(document.getElementById('categoryChart'), {
    type: 'doughnut',
    data: {
      labels: catData.map(c => c.label),
      datasets: [{
        data:            catData.map(c => c.value),
        backgroundColor: catData.map(c => c.color),
        borderWidth: 2,
        borderColor: '#fff',
        hoverOffset: 8,
      }],
    },
    options: {
      responsive: true,
      cutout: '60%',
      plugins: {
        legend: { position: 'bottom', labels: { padding: 14, font: { size: 12 } } },
        tooltip: { callbacks: { label: ctx => ` ฿${ctx.parsed.toLocaleString('th-TH')}` } },
      },
    },
  });
}

// ═══════════════════════════════════════════════
//  RENDER TABLE
// ═══════════════════════════════════════════════

function renderTable() {
  const txs = getMockTransactions();

  document.getElementById('txBody').innerHTML = txs.map((tx, i) => `
    <tr class="${i === 0 ? 'latest-row' : ''}">
      <td>${tx.date}${i === 0 ? ' <span class="latest-tag">ล่าสุด</span>' : ''}</td>
      <td><span class="badge-${tx.type}">${tx.type === 'income' ? '💰 รายรับ' : '💸 รายจ่าย'}</span></td>
      <td>${tx.category}</td>
      <td style="color:#475569">${tx.note}</td>
      <td class="amount-${tx.type}" style="text-align:right;font-size:1rem;">
        ${tx.type === 'income' ? '+' : '-'}฿${tx.amount.toLocaleString('th-TH')}
      </td>
    </tr>
  `).join('');
}

// ═══════════════════════════════════════════════
//  RENDER INSIGHTS
// ═══════════════════════════════════════════════

function renderInsight() {
  const monthly = getMockMonthlyData();
  const catData  = getMockCategoryData();
  const n = monthly.length;

  // Trend: compare last 2 months
  const last  = monthly[n - 1];
  const prev  = monthly[n - 2];
  const lastProfit = last.income - last.expense;
  const prevProfit = prev.income - prev.expense;
  const trendPct = (prevProfit !== 0
    ? ((lastProfit - prevProfit) / prevProfit * 100)
    : 0).toFixed(1);
  const trendUp = parseFloat(trendPct) >= 0;

  // High expense category (>40% of total)
  const totalCat = catData.reduce((s, c) => s + c.value, 0);
  const highCats = catData.filter(c => c.value / totalCat > 0.40);

  // Loss months
  const lossMonths = monthly.filter(m => m.income - m.expense < 0);

  // Best / Worst month by profit
  const profits = monthly.map(m => ({ ...m, profit: m.income - m.expense }));
  const best  = profits.reduce((a, b) => b.profit > a.profit ? b : a);
  const worst = profits.reduce((a, b) => b.profit < a.profit ? b : a);

  // ── Block A: สถานการณ์ตอนนี้ ──
  const blockA = [
    {
      cls: trendUp ? 'good' : 'bad',
      title: trendUp ? '📈 กำไรกำลังเพิ่ม' : '📉 กำไรลดลง',
      body: trendUp
        ? `เดือน ${last.month} กำไร <strong>฿${lastProfit.toLocaleString('th-TH')}</strong> เพิ่มขึ้น <strong>${trendPct}%</strong> จากเดือน ${prev.month} — ไปได้ดี! 🎉`
        : `เดือน ${last.month} กำไร <strong>฿${lastProfit.toLocaleString('th-TH')}</strong> ลดลง <strong>${Math.abs(trendPct)}%</strong> จากเดือน ${prev.month} — ควรดูรายจ่ายเพิ่มเติม`,
    },
    {
      cls: 'good',
      title: '🏆 เดือนที่ดีที่สุด',
      body: `<strong>${best.month}</strong> — กำไร <strong>฿${best.profit.toLocaleString('th-TH')}</strong> (รับ ฿${best.income.toLocaleString()} จ่าย ฿${best.expense.toLocaleString()})`,
    },
  ];

  // ── Block B: จุดที่ต้องระวัง ──
  const blockB = [];
  if (highCats.length > 0) {
    highCats.forEach(c => {
      blockB.push({
        cls: 'warn',
        title: `⚠️ ${c.label} สูงผิดปกติ`,
        body: `ค่าใช้จ่าย<strong>${c.label}</strong> ฿${c.value.toLocaleString('th-TH')} คิดเป็น <strong>${(c.value/totalCat*100).toFixed(0)}%</strong> ของรายจ่ายทั้งหมด — ควรหาทางลดต้นทุนส่วนนี้`,
      });
    });
  } else {
    blockB.push({ cls: 'good', title: '✅ ค่าใช้จ่ายสมดุล', body: 'ค่าใช้จ่ายแต่ละหมวดอยู่ในสัดส่วนปกติ ไม่มีหมวดไหนสูงเกินไป' });
  }
  if (lossMonths.length > 0) {
    blockB.push({
      cls: 'bad',
      title: '🔴 เดือนที่ขาดทุน',
      body: lossMonths.map(m => `<strong>${m.month}</strong> ขาดทุน ฿${Math.abs(m.income - m.expense).toLocaleString('th-TH')}`).join(' · '),
    });
  }

  // ── Block C: คำแนะนำ ──
  const blockC = [
    {
      cls: 'tip',
      title: '💡 สิ่งที่ควรทำต่อไป',
      body: `<ul style="margin:0;padding-left:18px;line-height:1.9">
        <li>ลองใช้<strong>ปุ๋ยอินทรีย์</strong>แทนปุ๋ยเคมีบางส่วนเพื่อลดต้นทุน</li>
        <li>วางแผน<strong>ขายผลผลิตล่วงหน้า</strong>เพื่อล็อคราคาให้มั่นใจ</li>
        <li>ใช้<strong>เครื่องจักรกล</strong>แทนแรงงานในขั้นตอนที่ทำได้</li>
        <li>จดบันทึกรายจ่าย<strong>ทุกวัน</strong>เพื่อเห็นภาพรายจ่ายชัดขึ้น</li>
      </ul>`,
    },
  ];

  function renderBlock(title, items) {
    return `
      <div class="insight-group">
        <div class="insight-group-title">${title}</div>
        <div class="insights-grid">
          ${items.map(ins => `
            <div class="insight-card ${ins.cls}">
              <div class="i-title">${ins.title}</div>
              <div class="i-body">${ins.body}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  document.getElementById('insightsGrid').innerHTML =
    renderBlock('📊 สถานการณ์ตอนนี้', blockA) +
    renderBlock('⚠️ จุดที่ต้องระวัง', blockB) +
    renderBlock('🧭 คำแนะนำ', blockC);
}

// ═══════════════════════════════════════════════
//  MAIN LOADER
// ═══════════════════════════════════════════════

function loadDashboard() {
  const days = parseInt(document.getElementById('daySelect').value, 10);
  const monthly = getMockMonthlyData();

  renderStatusBadge(monthly);
  renderSummary(monthly);
  renderQuickInsight(monthly);
  renderCharts(days);
  renderTable();
  renderInsight();
}

// ── Event listeners ──
document.getElementById('daySelect').addEventListener('change', loadDashboard);
document.getElementById('reloadBtn').addEventListener('click', loadDashboard);

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
